# Mensajes de cfdi4j. El código es el contrato estable (ADR 0002).
CFDI40102=El sello no corresponde a la cadena original: el documento fue alterado, o no se selló con el certificado que contiene.
CFDI40106=El atributo Certificado no contiene un certificado válido: {0}
CFDI4J-101=El documento no se puede leer como CFDI 4.0: {0}
CFDI4J-102=El atributo {0} es necesario para verificar el sello.
CFDI4J-103=El NoCertificado {0} no corresponde al número del certificado, {1}.
CFDI4J-104=El SelloCFD del TimbreFiscalDigital no es el Sello del comprobante.
CFDI4J-105=No se verificó el SelloSAT: el certificado del SAT {0} no está disponible.
CFDI4J-106=El SelloSAT no corresponde a la cadena original del TimbreFiscalDigital: el timbre fue alterado.
CFDI4J-108=El certificado {0} no fue emitido por una de las autoridades certificadoras del SAT configuradas.
CFDI4J-108.no.verificado=No se verificó que el SAT haya emitido el certificado {0}: configure las autoridades del SAT (SatAuthorities) en CfdiEngine.
CFDI4J-109=El documento mide {0} bytes; el máximo permitido es {1}. No se leyó.
