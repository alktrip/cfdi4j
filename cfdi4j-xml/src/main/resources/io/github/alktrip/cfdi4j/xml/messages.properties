# Messages of cfdi4j-xml (English, fallback). The code is the stable contract (ADR 0002).
CFDI4J-001=The XML does not conform to the SAT XSD schema: {0}
CFDI4J-002=The complement with namespace {0} was not validated against its XSD schema, because cfdi4j does not bundle that schema.
CFDI4J-003=The document is not well-formed XML: {0}
