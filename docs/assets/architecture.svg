<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">cfdi4j architecture</title>
  <desc id="desc">Modules of cfdi4j and their dependencies: the cfdi4j facade depends on cfdi4j-xml and cfdi4j-crypto, which depend on cfdi4j-core. cfdi4j-pagos20 depends on core and xml; cfdi4j-catalogs depends on core. Complements, rule sets and the catalog provider are discovered with ServiceLoader. The official SAT XSD and XSLT files are bundled and resolved offline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1128"/>
      <stop offset="1" stop-color="#0f1d40"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <style>
      .box { fill: #111f45; stroke: #22d3ee; stroke-width: 1.6; }
      .main { fill: #12295e; stroke: #3b82f6; stroke-width: 2.2; }
      .ext { fill: none; stroke: #3b82f6; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .name { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e0f7ff; }
      .text { font: 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #9fb6d9; }
      .title { font: 700 22px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #22d3ee; }
      .label { font: 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill: #60a5fa; }
      .dep { stroke: #38bdf8; stroke-width: 1.6; fill: none; }
      .spi { stroke: #3b82f6; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="40" y="52" class="title">cfdi4j</text>
  <text x="122" y="52" class="text">CFDI 4.0 for Java · build · validate · seal · verify</text>

  <!-- facade -->
  <rect x="330" y="88" width="300" height="78" rx="12" class="main"/>
  <text x="480" y="120" text-anchor="middle" class="name">cfdi4j</text>
  <text x="480" y="144" text-anchor="middle" class="text">Cfdi4j.validate · seal · verify</text>

  <!-- xml -->
  <rect x="120" y="236" width="300" height="92" rx="12" class="box"/>
  <text x="270" y="266" text-anchor="middle" class="name">cfdi4j-xml</text>
  <text x="270" y="290" text-anchor="middle" class="text">writer · parser · XSD validation</text>
  <text x="270" y="310" text-anchor="middle" class="text">cadena original (Saxon-HE, XSLT 2.0)</text>

  <!-- crypto -->
  <rect x="540" y="236" width="300" height="92" rx="12" class="box"/>
  <text x="690" y="266" text-anchor="middle" class="name">cfdi4j-crypto</text>
  <text x="690" y="290" text-anchor="middle" class="text">CSD .cer/.key · SHA256withRSA</text>
  <text x="690" y="310" text-anchor="middle" class="text">JCA only, no extra dependencies</text>

  <!-- core -->
  <rect x="330" y="404" width="300" height="92" rx="12" class="main"/>
  <text x="480" y="434" text-anchor="middle" class="name">cfdi4j-core</text>
  <text x="480" y="458" text-anchor="middle" class="text">model · builders · SAT catalogs</text>
  <text x="480" y="478" text-anchor="middle" class="text">rules of the error matrix · ports</text>

  <!-- pagos20 -->
  <rect x="40" y="404" width="230" height="92" rx="12" class="box"/>
  <text x="155" y="434" text-anchor="middle" class="name">cfdi4j-pagos20</text>
  <text x="155" y="458" text-anchor="middle" class="text">complemento de pagos 2.0</text>
  <text x="155" y="478" text-anchor="middle" class="text">model · XML · CRP rules</text>

  <!-- catalogs -->
  <rect x="690" y="404" width="230" height="92" rx="12" class="box"/>
  <text x="805" y="434" text-anchor="middle" class="name">cfdi4j-catalogs</text>
  <text x="805" y="458" text-anchor="middle" class="text">c_ClaveProdServ · c_ClaveUnidad</text>
  <text x="805" y="478" text-anchor="middle" class="text">c_CodigoPostal</text>

  <!-- SAT resources -->
  <rect x="40" y="88" width="230" height="78" rx="12" class="ext"/>
  <text x="155" y="118" text-anchor="middle" class="name">SAT files</text>
  <text x="155" y="142" text-anchor="middle" class="text">XSD · XSLT · bundled, offline</text>

  <!-- ports -->
  <rect x="690" y="88" width="230" height="78" rx="12" class="ext"/>
  <text x="805" y="118" text-anchor="middle" class="name">your adapters</text>
  <text x="805" y="142" text-anchor="middle" class="text">RFC list · certificate status</text>

  <!-- dependencies -->
  <path d="M420,166 L330,236" class="dep" marker-end="url(#arrow)"/>
  <path d="M540,166 L630,236" class="dep" marker-end="url(#arrow)"/>
  <path d="M300,328 L400,404" class="dep" marker-end="url(#arrow)"/>
  <path d="M660,328 L560,404" class="dep" marker-end="url(#arrow)"/>
  <path d="M270,450 L330,450" class="dep" marker-end="url(#arrow)"/>
  <path d="M155,404 L200,328" class="dep" marker-end="url(#arrow)"/>
  <path d="M690,450 L630,450" class="dep" marker-end="url(#arrow)"/>
  <path d="M155,166 L230,236" class="spi" marker-end="url(#dash)"/>
  <path d="M920,127 H944 V384 H600 V402" class="spi" marker-end="url(#dash)"/>

  <text x="40" y="522" class="label">─ depends on    ┄ resource or port · complements, rule sets and catalogs are found with ServiceLoader</text>
</svg>
