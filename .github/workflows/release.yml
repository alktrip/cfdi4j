name: Release

# Publishes a tagged version to Maven Central. The upload is validated by the Central Portal but
# NOT published automatically (autoPublish=false in the release profile): the maintainer reviews
# the deployment at https://central.sonatype.com and publishes it by hand. A draft GitHub release
# is created with the notes of CHANGELOG.md.
#
# Repository secrets:
#   CENTRAL_USERNAME, CENTRAL_TOKEN   user token of the Central Portal
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE   key that signs the artifacts (public key on a keyserver)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check that the tag matches the project version
        run: |
          version=$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
      - name: Build, test, sign and upload to the Central Portal
        run: ./mvnw -B -ntp -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Extract the notes of this version from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^## \[/ { exit } on && !/^\[[^]]*\]: / ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create a draft GitHub release with the Javadoc
        run: gh release create "$GITHUB_REF_NAME" --draft --title "cfdi4j ${GITHUB_REF_NAME#v}" --notes-file release-notes.md */target/*-javadoc.jar
        env:
          GH_TOKEN: ${{ github.token }}
