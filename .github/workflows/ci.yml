name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Baseline LTS and latest LTS (ADR 0001).
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, coverage and static analysis
        run: ./mvnw -B -ntp verify
      - name: Upload coverage reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  catalogs:
    name: Generated catalogs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download the official SAT files and verify their hashes
        run: specs/fetch-sources.sh
      - name: Regenerate catalog sources
        run: ./mvnw -B -ntp -P generate-catalogs -pl tools/catalog-generator -am verify
      - name: Fail if regeneration changed anything
        run: git diff --exit-code
