name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Baseline LTS and latest LTS (ADR 0001).
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, coverage and static analysis
        run: ./mvnw -B -ntp verify
      - name: Coverage summary
        if: matrix.java == '21'
        run: |
          {
            echo '| Module | Instructions | Branches |'
            echo '|---|---|---|'
            for csv in */target/site/jacoco/jacoco.csv; do
              awk -F, -v m="${csv%%/*}" 'NR > 1 { mi += $4; ci += $5; mb += $6; cb += $7 }
                END { printf "| %s | %.1f %% | %.1f %% |\n", m, 100 * ci / (mi + ci), (mb + cb) ? 100 * cb / (mb + cb) : 100 }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  javadoc:
    name: Javadoc and release packaging (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build sources and Javadoc jars; Javadoc warnings fail the build
        run: ./mvnw -B -ntp -P release -Dgpg.skip -DskipTests -Djacoco.skip=true verify

  catalogs:
    name: Generated catalogs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download the official SAT files and verify their hashes
        run: specs/fetch-sources.sh
      - name: Regenerate catalog sources
        run: ./mvnw -B -ntp -P generate-catalogs -pl tools/catalog-generator -am verify
      - name: Fail if regeneration changed anything
        run: git diff --exit-code

  external-vectors:
    name: Third-party vectors (ADR 0005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify against downloaded, hash-pinned vectors
        run: ./mvnw -B -ntp -P external-vectors verify
