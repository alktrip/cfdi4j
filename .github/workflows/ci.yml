name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Baseline LTS and latest LTS (ADR 0001).
        java: ['21', '25']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, coverage and static analysis
        run: ./mvnw -B -ntp verify
      - name: Coverage summary
        if: matrix.java == '21'
        run: |
          {
            echo '| Module | Instructions | Branches |'
            echo '|---|---|---|'
            for csv in */target/site/jacoco/jacoco.csv; do
              awk -F, -v m="${csv%%/*}" 'NR > 1 { mi += $4; ci += $5; mb += $6; cb += $7 }
                END { printf "| %s | %.1f %% | %.1f %% |\n", m, 100 * ci / (mi + ci), (mb + cb) ? 100 * cb / (mb + cb) : 100 }' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  javadoc:
    name: Javadoc and release packaging (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build sources and Javadoc jars; Javadoc warnings fail the build
        run: ./mvnw -B -ntp -P release -Dgpg.skip -DskipTests -Djacoco.skip=true verify

  catalogs:
    name: Generated catalogs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download the official SAT files and verify their hashes
        run: specs/fetch-sources.sh
      - name: Regenerate catalog sources
        run: ./mvnw -B -ntp -P generate-catalogs -pl tools/catalog-generator -am verify
      - name: Fail if regeneration changed any generated file
        # Only the generated paths: unrelated changes (for example line endings that a bot writes
        # into a wrapper script) must not fail this check.
        run: |
          paths="cfdi4j-core/src/main/java cfdi4j-pagos20/src/main/java cfdi4j-catalogs/src/main/resources"
          git diff --exit-code -- $paths
          test -z "$(git status --porcelain --untracked-files=all -- $paths)"

  external-vectors:
    name: Third-party vectors (ADR 0005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify against downloaded, hash-pinned vectors
        run: ./mvnw -B -ntp -P external-vectors verify
