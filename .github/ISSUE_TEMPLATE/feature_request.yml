name: Feature request
description: Propose a new capability, complement or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do that cfdi4j does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind.
  - type: textarea
    id: sources
    attributes:
      label: SAT sources
      description: Links to the public SAT documents that define the behavior (standard, guía de llenado, matrix, XSD).
